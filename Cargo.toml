[package]
name = "harmonium"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A local music player running entirely inside the Linux terminal"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
libc = "0.2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
lofty = "0.25.1"
natord = "1.0.9"
ratatui = "0.30.2"
# Animated loading spinners used by every in-flight surface (Now Playing,
# lyrics, Add Stream popup, status bar). Pinned to 0.7 because it depends on
# the same `ratatui ^0.30` we already use, so the spinner widgets plug in
# without any feature flags or compat shims.
ratatui-cheese = "0.7"
# Default features pull in chafa-dyn, which links against a system libchafa
# that cannot be assumed on user machines, so only the crossterm backend and
# the image formats unified from our own image dependency are enabled
ratatui-image = { version = "11.0.6", default-features = false, features = [
    "crossterm",
] }
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "symphonia-all",
] }
serde = { version = "1.0.229", features = ["derive"] }
# Direct dependency (no extra features) so the settings Sound tab can
# enumerate hosts and devices for runtime output selection.
cpal = "0.17.3"
# SPA constants (channel flags, pod type ids) generated by libspa bindgen.
spa_sys = { package = "libspa-sys", version = "0.10" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "fs",
    "macros",
] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
# Strict URL parser used by the streaming layer to validate user input and to
# build stable identifiers for stream tracks. Without it we would have to
# hand-roll host/scheme detection, which is exactly the kind of input-parsing
# surface that must not live in this codebase.
url = "2"
# HLS (M3U8) parser used by the HLS demuxer for live radio and YouTube Live
# streams. `hls_m3u8` is a parsing-only crate with a single tiny transitive
# dependency (`stable-vec`) so it does not pull a runtime or async stack into
# the audio path, which the player keeps fully synchronous (reqwest blocking).
hls_m3u8 = "0.7"
serde_json = "1"
sha2 = "0.10"
# Pitch-preserving tempo (time-stretch) for the playback speed control. Bundled
# as an FFI bridge to the SoundTouch C++ library; the audio worker feeds the
# stream through it so that `[` / `]` change tempo without altering pitch.
soundtouch = "0.5.4"
toml = "1.1.4"
toml_edit = { version = "0.25.11", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Measure text by terminal display column width (not char count) so settings
# rows are truncated exactly the way ratatui lays them out.
unicode-width = "0.2"
pipewire = "0.10.1"

[dev-dependencies]
proptest = "1.6"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
